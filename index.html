<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Investment Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-gray-900 p-6 flex flex-col border-r border-gray-800">
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-2xl font-bold">£</div>
        <h1 class="text-2xl font-bold">UK InvestTrack</h1>
      </div>
      
      <nav class="space-y-2">
        <button onclick="showSection('dashboard')" class="nav-btn w-full text-left px-4 py-3 rounded-2xl hover:bg-gray-800 flex items-center gap-3 bg-gray-800">
          <i class="fas fa-home"></i> Dashboard
        </button>
        <button onclick="showSection('holdings')" class="nav-btn w-full text-left px-4 py-3 rounded-2xl hover:bg-gray-800 flex items-center gap-3">
          <i class="fas fa-briefcase"></i> Holdings
        </button>
        <button onclick="showSection('transactions')" class="nav-btn w-full text-left px-4 py-3 rounded-2xl hover:bg-gray-800 flex items-center gap-3">
          <i class="fas fa-list"></i> Transactions
        </button>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8 overflow-auto">
      <div id="dashboard" class="section">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-4xl font-bold">Portfolio Dashboard</h1>
          <button onclick="showNewTransactionModal()" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-2xl flex items-center gap-2 font-medium">
            <i class="fas fa-plus"></i> New Transaction
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="summaryCards"></div>

        <div class="mt-10">
          <h2 class="text-xl font-semibold mb-4">Your Portfolios</h2>
          <div id="portfoliosList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
      </div>

      <div id="holdings" class="section hidden"><h2 class="text-3xl font-bold">Holdings</h2><p class="text-gray-400 mt-8">Coming soon...</p></div>
      <div id="transactions" class="section hidden"><h2 class="text-3xl font-bold">Transactions</h2><p class="text-gray-400 mt-8">Coming soon...</p></div>
    </div>
  </div>

  <!-- Transaction Modal -->
  <div id="transactionModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-8 w-full max-w-lg">
      <h2 class="text-2xl font-bold mb-6">New Transaction</h2>

      <div class="space-y-5">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Portfolio</label>
          <select id="modalPortfolio" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3"></select>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1">Type</label>
          <select id="modalType" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
            <option value="Buy">Buy</option>
            <option value="Sell">Sell</option>
            <option value="Dividend">Dividend</option>
            <option value="Deposit">Deposit</option>
            <option value="Withdrawal">Withdrawal</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1">Date</label>
            <input type="date" id="modalDate" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Ticker</label>
            <input type="text" id="modalTicker" placeholder="AAPL" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 uppercase">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1">Shares</label>
            <input type="number" id="modalShares" step="0.0001" oninput="calculateGBP()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Price per Share</label>
            <input type="number" id="modalPrice" step="0.01" oninput="calculateGBP()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Currency</label>
            <select id="modalCurrency" onchange="updateCurrencyLabels()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
              <option value="GBP">GBP</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
        </div>

        <div id="fxContainer" class="hidden grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1">FX Rate (to GBP)</label>
            <input type="number" id="modalFXRate" step="0.0001" value="0.78" oninput="calculateGBP()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Total Amount GBP</label>
            <input type="number" id="modalAmountGBP" readonly class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
          </div>
        </div>

        <div>
          <label id="feesLabel" class="block text-sm text-gray-400 mb-1">Fees</label>
          <input type="number" id="modalFees" step="0.01" value="0" oninput="calculateGBP()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1">Notes</label>
          <textarea id="modalNotes" rows="2" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3"></textarea>
        </div>
      </div>

      <div class="flex gap-3 mt-8">
        <button onclick="hideModal()" class="flex-1 py-4 rounded-2xl border border-gray-700 hover:bg-gray-800">Cancel</button>
        <button onclick="saveTransaction()" class="flex-1 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 font-medium">Save Transaction</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx1hjx4IcJF6ZqFh_0s1snaAE_CYXsGMvHjAmI7ok8q_Ein3wnNIwbnE-KI7A7a2PEp/exec";

    let portfoliosList = [];

    async function loadDashboard() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getDashboard`);
        const data = await res.json();

        if (data.success) {
          portfoliosList = data.portfolios || [];

          document.getElementById("summaryCards").innerHTML = `
            <div class="bg-gray-900 rounded-3xl p-6">
              <p class="text-gray-400">Total Value</p>
              <p class="text-4xl font-bold mt-2">£${Number(data.totalValue || 0).toLocaleString()}</p>
            </div>
            <div class="bg-gray-900 rounded-3xl p-6">
              <p class="text-gray-400">Unrealised P&L</p>
              <p class="text-4xl font-bold mt-2 text-emerald-400">£${Number(data.totalPL || 0).toLocaleString()}</p>
            </div>
            <div class="bg-gray-900 rounded-3xl p-6">
              <p class="text-gray-400">Cash</p>
              <p class="text-4xl font-bold mt-2">£${Number(data.totalCash || 0).toLocaleString()}</p>
            </div>
            <div class="bg-gray-900 rounded-3xl p-6">
              <p class="text-gray-400">Holdings</p>
              <p class="text-4xl font-bold mt-2">${data.numHoldings || 0}</p>
            </div>
          `;

          let html = '';
          data.portfolios.forEach(p => {
            html += `<div class="bg-gray-900 rounded-2xl p-5"><p class="font-semibold">${p.name}</p><p class="text-sm text-gray-400">${p.type}</p></div>`;
          });
          document.getElementById("portfoliosList").innerHTML = html || "<p class='text-gray-400'>No portfolios found.</p>";
        }
      } catch(e) { console.error(e); }
    }

    function showNewTransactionModal() {
      document.getElementById('transactionModal').classList.remove('hidden');
      const select = document.getElementById('modalPortfolio');
      select.innerHTML = '';
      portfoliosList.forEach(p => {
        const opt = new Option(`${p.name} (${p.type})`, p.id);
        select.add(opt);
      });
      document.getElementById('modalDate').value = new Date().toISOString().split('T')[0];
      updateCurrencyLabels();
    }

    function updateCurrencyLabels() {
      const currency = document.getElementById('modalCurrency').value;
      document.getElementById('feesLabel').textContent = `Fees (${currency})`;
      document.getElementById('fxContainer').classList.toggle('hidden', currency === 'GBP');
      calculateGBP();
    }

    function calculateGBP() {
      const shares = parseFloat(document.getElementById('modalShares').value) || 0;
      const price = parseFloat(document.getElementById('modalPrice').value) || 0;
      const fx = parseFloat(document.getElementById('modalFXRate').value) || 1;
      const fees = parseFloat(document.getElementById('modalFees').value) || 0;
      const totalGBP = ((shares * price) + fees) * fx;
      document.getElementById('modalAmountGBP').value = totalGBP.toFixed(2);
    }

    function hideModal() {
      document.getElementById('transactionModal').classList.add('hidden');
    }

    async function saveTransaction() {
      try {
        const data = {
          action: "addTransaction",
          portfolioId: document.getElementById("modalPortfolio").value,
          type: document.getElementById("modalType").value,
          date: document.getElementById("modalDate").value,
          ticker: document.getElementById("modalTicker").value.toUpperCase(),
          shares: document.getElementById("modalShares").value,
          price: document.getElementById("modalPrice").value,
          currency: document.getElementById("modalCurrency").value,
          fxRate: document.getElementById("modalFXRate").value || 1,
          amountGBP: document.getElementById("modalAmountGBP").value,
          fees: document.getElementById("modalFees").value || 0,
          notes: document.getElementById("modalNotes").value
        };

        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(data)
        });

        const result = await res.json();
        if (result.success) {
          alert("✅ Transaction saved successfully!");
          hideModal();
          loadDashboard();
        } else {
          alert("Error: " + (result.error || "Unknown error"));
        }
      } catch (e) {
        alert("Connection error. Please try again.");
      }
    }

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
      if (section === 'dashboard') loadDashboard();
    }

    window.onload = () => showSection('dashboard');
  </script>
</body>
</html>
